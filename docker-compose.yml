version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberops_backend
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app
    networks:
      - cyberops_net

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: cyberops_frontend
    restart: always
    env_file:
      - .env
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - cyberops_net

volumes:
  backend_data:

networks:
  cyberops_net:
    driver: bridge
